# Cloud build for the iPhone app (no Mac needed).
# Codemagic builds the app on a Mac in the cloud, signs it and uploads it to App Store Connect.
#
# One-time setup in Codemagic (see store/IPHONE_BUILD_WITHOUT_MAC.md):
#   1. Team integrations > Developer Portal: add your App Store Connect API key, name it exactly: Breakout ASC key
#   2. App > Environment variables: add CERTIFICATE_PRIVATE_KEY (secret) in group: ios_signing
#
# Every run gets a new build number automatically, so you never need to change it by hand.
# For a new app version (1.1, 1.2 ...) change APP_VERSION below.

workflows:
  ios-app-store:
    name: iPhone app > App Store Connect
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Breakout ASC key
    environment:
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: com.breakout2026.game
        APP_VERSION: "1.0"
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: latest
    triggering:
      events: []   # only runs when you press "Start new build"
    scripts:
      - name: Install packages
        script: npm ci
      - name: Build the game and copy it into the iPhone project
        script: |
          npm run build:mobile
          npx cap sync ios
      - name: Set version and build number
        script: |
          NEXT=$(( BUILD_NUMBER + 1 ))   # Codemagic counts up by one every run
          echo "Version $APP_VERSION, build $NEXT"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $NEXT;/g; s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $APP_VERSION;/g" "$XCODE_PROJECT/project.pbxproj"
      - name: Get signing certificate and profile from Apple (created automatically the first time)
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
      - name: Apply signing to the Xcode project
        script: |
          # Profiles can be in the old or the new (Xcode 16+) folder
          for f in "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.provisionprofile; do
            [ -f "$f" ] || continue
            echo "Checking $f"
            security cms -D -i "$f" > /tmp/p.plist 2>/dev/null || continue
            APPID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/p.plist 2>/dev/null || true)
            DEVICES=$(/usr/libexec/PlistBuddy -c "Print :ProvisionedDevices" /tmp/p.plist 2>/dev/null || true)
            echo "  app id: $APPID"
            if [[ "$APPID" == *".$BUNDLE_ID" ]] && [ -z "$DEVICES" ]; then
              PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/p.plist)
              PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/p.plist)
              TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" /tmp/p.plist)
            fi
          done
          if [ -z "$PROFILE_NAME" ]; then echo "No App Store profile found for $BUNDLE_ID"; exit 1; fi
          echo "Profile: $PROFILE_NAME ($PROFILE_UUID), team $TEAM_ID"
          PBX="$XCODE_PROJECT/project.pbxproj"
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g" "$PBX"
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID; DEVELOPMENT_TEAM = $TEAM_ID; PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\"; \"CODE_SIGN_IDENTITY[sdk=iphoneos*]\" = \"Apple Distribution\";/g" "$PBX"
          grep -n "PROVISIONING_PROFILE_SPECIFIER\|DEVELOPMENT_TEAM\|CODE_SIGN" "$PBX"
          cat > "$HOME/export_options.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict>
          </plist>
          PLIST
          plutil -lint "$HOME/export_options.plist"
      - name: Build signed .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --export-options-plist "$HOME/export_options.plist"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
